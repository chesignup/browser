<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>chromebox viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; height:100%; background:#111; font-family:system-ui,sans-serif; }
  #bar { display:flex; gap:6px; padding:6px; background:#1c1c1c; align-items:center; }
  #bar input { flex:1; min-width:0; padding:8px; border-radius:6px; border:1px solid #333; background:#222; color:#eee; font-size:16px; }
  #bar button { padding:8px 10px; border-radius:6px; border:0; background:#3355dd; color:#fff; font-size:15px; }
  #tabs { display:flex; gap:6px; padding:6px 6px 0; background:#151515; overflow-x:auto; white-space:nowrap; }
  #tabs .tab { flex:0 0 auto; max-width:180px; overflow:hidden; text-overflow:ellipsis; padding:6px 10px; border-radius:6px 6px 0 0; background:#242424; color:#ccc; font-size:13px; border:1px solid #333; border-bottom:0; }
  #tabs .tab.active { background:#3355dd; color:#fff; }
  #tabs .newtab { flex:0 0 auto; padding:6px 10px; background:#242424; color:#8f8; border-radius:6px; border:1px solid #333; }
  #stage { position:relative; height:calc(100% - 96px); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #screen { max-width:100%; max-height:100%; touch-action:none; user-select:none; -webkit-user-drag:none; }
  #kbd { position:absolute; opacity:0; pointer-events:none; height:0; width:0; }
  #status { position:absolute; top:6px; left:8px; color:#8f8; font-size:12px; background:#0008; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <div id="bar">
    <button id="kbdBtn" title="keyboard">⌨</button>
    <input id="url" placeholder="https://…" inputmode="url" autocomplete="off">
    <button id="go">Go</button>
    <button id="reload" title="reload">⟳</button>
  </div>
  <div id="tabs"></div>
  <div id="stage">
    <img id="screen" alt="remote tab" draggable="false">
    <input id="kbd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="status">connecting…</div>
  </div>
<script>
const img = document.getElementById('screen');
const statusEl = document.getElementById('status');
const kbd = document.getElementById('kbd');
let ws, connected=false;

function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.onopen = ()=>{ connected=true; statusEl.textContent='live'; };
  ws.onclose = ()=>{ connected=false; statusEl.textContent='reconnecting…'; setTimeout(connect,1000); };
  ws.onerror = ()=>{ statusEl.textContent='error'; };
  ws.onmessage = (e)=>{
    const m = JSON.parse(e.data);
    if(m.frame){ img.src = 'data:image/jpeg;base64,'+m.frame; }
    else if(m.tabs){ renderTabs(m.tabs, m.current); }
    else if(m.error){ statusEl.textContent = m.error; }
  };
}

const tabsEl = document.getElementById('tabs');
function renderTabs(tabs, current){
  tabsEl.innerHTML='';
  tabs.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='tab'+(t.id===current?' active':'');
    d.textContent=(t.title||t.url||('tab '+(i+1)));
    d.title=t.url||'';
    d.onclick=()=>send({t:'select_tab', id:t.id});
    tabsEl.appendChild(d);
  });
  const nt=document.createElement('div');
  nt.className='newtab'; nt.textContent='+';
  nt.onclick=()=>send({t:'new_tab'});
  tabsEl.appendChild(nt);
}
function send(o){ if(connected) ws.send(JSON.stringify(o)); }

// Map a pointer event to normalized coords over the displayed image.
function norm(ev){
  const r = img.getBoundingClientRect();
  const cx = (ev.clientX ?? (ev.touches&&ev.touches[0].clientX));
  const cy = (ev.clientY ?? (ev.touches&&ev.touches[0].clientY));
  return { nx: Math.min(1,Math.max(0,(cx-r.left)/r.width)),
           ny: Math.min(1,Math.max(0,(cy-r.top)/r.height)) };
}

let dragging=false, moved=false, last=null;
img.addEventListener('pointerdown', (ev)=>{ ev.preventDefault(); dragging=true; moved=false; last=norm(ev); const p=norm(ev); send({t:'down',...p}); });
img.addEventListener('pointermove', (ev)=>{
  if(!dragging) return; ev.preventDefault();
  const p=norm(ev);
  const dy=(last.ny-p.ny)* (img.getBoundingClientRect().height);
  const dx=(last.nx-p.nx)* (img.getBoundingClientRect().width);
  if(Math.abs(dy)+Math.abs(dx)>3){ moved=true; send({t:'scroll', nx:p.nx, ny:p.ny, dx:dx, dy:dy}); last=p; }
});
img.addEventListener('pointerup', (ev)=>{
  if(!dragging) return; ev.preventDefault(); dragging=false;
  const p=norm(ev);
  if(!moved){ send({t:'click',...p}); }
  else { send({t:'up',...p}); }
});

// Keyboard: toggle hidden input focus; forward text + Enter/Backspace.
document.getElementById('kbdBtn').onclick = ()=>{ kbd.value=''; kbd.focus(); };
kbd.addEventListener('input', ()=>{ if(kbd.value){ send({t:'text', text:kbd.value}); kbd.value=''; } });
kbd.addEventListener('keydown', (e)=>{
  if(['Enter','Backspace','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape'].includes(e.key)){
    e.preventDefault(); send({t:'key', key:e.key});
  }
});

// URL bar
document.getElementById('go').onclick = ()=>{ let u=document.getElementById('url').value.trim(); if(u){ if(!/^https?:/.test(u)) u='https://'+u; send({t:'nav', url:u}); } };
document.getElementById('url').addEventListener('keydown',(e)=>{ if(e.key==='Enter') document.getElementById('go').click(); });
document.getElementById('reload').onclick = ()=> send({t:'reload'});

connect();
</script>
</body>
</html>
