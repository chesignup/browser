[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-browser"
version = "0.1.0"
description = "Human-like browser automation: Playwright first, Carbonyl + CDP + tmux fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40",
  "websockets>=12.0",
]

[project.scripts]
human-browser = "human_browser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["human_browser*"]
