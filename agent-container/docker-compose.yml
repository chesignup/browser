services:
  agent:
    build: .
    image: cursor-agent-box
    container_name: cursor-agent
    hostname: cursor-agent
    # Real Tailscale networking (own tailnet node).
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "2223:22"          # SSH from the LAN: ssh -p 2223 root@<host-ip>
    environment:
      - GUEST_HOST=100.92.122.70   # guest Tailscale IP (or MagicDNS name 'chromebox')
      - ROOT_PASSWORD=agent        # change me; SSH password for this container
      - AGENT_MODEL=gpt-5.4-mini   # cheap default model (e.g. composer-2.5-fast, gemini-3.8-flash-medium, cursor-grok-4.6-low)
      # - AUTHORIZED_KEYS=ssh-ed25519 AAAA...   # optional: your pubkey for key-based SSH
    volumes:
      # Paths relative to this compose file's parent (repo root). Override BROWSER_ROOT if needed.
      - ${BROWSER_ROOT:-..}:/opt/human_browser:ro
      - ${BROWSER_ROOT:-..}/mcp-container/app:/app:ro
      - ${BROWSER_ROOT:-..}/qemu-browser/var/id_ed25519:/guest_key.ro:ro
      - ${BROWSER_ROOT:-..}/skills:/root/.cursor/skills:ro
      - ${BROWSER_ROOT:-..}/scrape:/root/work/scrape:ro
      - ts-state:/var/lib/tailscale
      - cursor-config:/root/.config
      - cursor-local:/root/.local/share
    restart: unless-stopped

volumes:
  ts-state:
  cursor-config:
  cursor-local:
